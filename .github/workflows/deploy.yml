name: karsajobs-backend

on:
  push:
    branches:
      - karsajobs
  workflow_dispatch:

jobs:
  karsajobs-backend:
    runs-on: ubuntu-latest

    env:
      CR_PAT: ${{ secrets.CR_PAT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.6

      - name: Docker lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Test app
        run: |
          go test -v -short --count=1 $(go list ./...)

      - name: Run script
        run: |
          chmod +x build_push_image_karsajobs.sh
          ./build_push_image_karsajobs.sh
        shell: bash
